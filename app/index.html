<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Picks the starting theme before first paint: saved choice ("jj-theme", see
      // src/lib/theme.tsx), else the device setting. The /embed/* widget sits inside the
      // light marketing site, so it always stays light. useTheme() starts from this result.
      (function () {
        var t = null;
        try { t = localStorage.getItem("jj-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark" && location.pathname.indexOf("/embed/") !== 0) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#020817");
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="https://horizons-cdn.hostinger.com/15d30f89-ee6f-40af-a967-2464869fd5b6/9ea32c75ba64244cf18f6e0a21785444.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Book a Session | JJ Private Training, Co.</title>
    <meta name="description" content="Book private and small-group soccer training with JJ Private Training, Co." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
